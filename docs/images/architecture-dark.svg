  <path d="M528 142 V164" fill="none" stroke="#6f747c" stroke-width="1.6" marker-end="url(#head-6f747c)"/>
  <g>
    <rect x="238" y="166" width="176" height="54" rx="10" fill="#1c1f24" stroke="#363b43"/>
    <text x="326" y="189" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ece9e2">Keyword index</text>
    <text x="326" y="207" text-anchor="middle" font-size="12" fill="#9c9890">BM25 · Arabic-aware</text>
  </g>
  <g>
    <rect x="440" y="166" width="176" height="54" rx="10" fill="#1c1f24" stroke="#363b43"/>
    <text x="528" y="189" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ece9e2">Semantic index</text>
    <text x="528" y="207" text-anchor="middle" font-size="12" fill="#9c9890">multilingual-e5 · Worker</text>
  </g>
  <text x="222" y="190" text-anchor="end" font-size="11.5" fill="#9c9890">both saved in</text>
  <text x="222" y="206" text-anchor="end" font-size="11.5" fill="#9c9890">IndexedDB</text>

  <!-- Asking -->
  <g>
    <rect x="36" y="292" width="176" height="54" rx="10" fill="#1c1f24" stroke="#363b43"/>
    <text x="124" y="315" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ece9e2">Your question</text>
