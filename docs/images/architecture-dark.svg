    <text x="225" y="451" text-anchor="middle" font-size="12" fill="#9c9890">click [1] to open the exact passage</text>
  </g>

  <!-- Server -->
  <g>
    <rect x="688" y="64" width="236" height="54" rx="10" fill="#1c1f24" stroke="#363b43"/>
    <text x="806" y="87" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ece9e2">api/chat</text>
    <text x="806" y="105" text-anchor="middle" font-size="12" fill="#9c9890">builds the prompt itself</text>
  </g>
  <g>
    <rect x="688" y="130" width="236" height="54" rx="10" fill="#2a2418" stroke="#6b5a36"/>
    <text x="806" y="153" text-anchor="middle" font-size="14.5" font-weight="600" fill="#e2c68e">Holds the API key</text>
    <text x="806" y="171" text-anchor="middle" font-size="12" fill="#9c9890">never sent to the browser</text>
  </g>
  <g>
    <rect x="688" y="196" width="236" height="42" rx="10" fill="#1c1f24" stroke="#363b43"/>
    <text x="806" y="219" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ece9e2">Fair-use limit</text>
    <text x="806" y="237" text-anchor="middle" font-size="12" fill="#9c9890">per visitor, per day</text>
  </g>
