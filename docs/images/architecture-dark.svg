<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="TalkToPDF architecture: documents are parsed, chunked and indexed in the browser; questions are matched with hybrid search; a Vercel function holding the API key asks Groq and streams back a cited answer.">
  <defs><marker id="head-6f747c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f747c"/></marker><marker id="head-5dbaa0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5dbaa0"/></marker></defs>

  <g>
    <rect x="16" y="16" width="620" height="484" rx="16" fill="#15171b" stroke="#2b2f36"/>
    <text x="36" y="46" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#c8a96e">IN YOUR BROWSER</text>
    <text x="616" y="46" text-anchor="end" font-size="11.5" fill="#9c9890">files never leave the device</text>
  </g>
  <g>
    <rect x="668" y="16" width="276" height="236" rx="16" fill="#15171b" stroke="#2b2f36"/>
    <text x="688" y="46" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#c8a96e">VERCEL FUNCTION</text>
    
  </g>
  <g>
    <rect x="668" y="268" width="276" height="232" rx="16" fill="#15171b" stroke="#2b2f36"/>
    <text x="688" y="298" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#c8a96e">LLM (GROQ)</text>
    
  </g>

  <!-- Indexing -->
  <g>
    <rect x="36" y="64" width="176" height="54" rx="10" fill="#1c1f24" stroke="#363b43"/>
    <text x="124" y="87" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ece9e2">Your files</text>
    <text x="124" y="105" text-anchor="middle" font-size="12" fill="#9c9890">PDF · TXT · Markdown</text>
  </g>
  <g>
    <rect x="238" y="64" width="176" height="54" rx="10" fill="#1c1f24" stroke="#363b43"/>
    <text x="326" y="87" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ece9e2">Extract text</text>
    <text x="326" y="105" text-anchor="middle" font-size="12" fill="#9c9890">pdf.js, RTL, header cleanup</text>
  </g>
  <g>
    <rect x="440" y="64" width="176" height="54" rx="10" fill="#1c1f24" stroke="#363b43"/>
    <text x="528" y="87" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ece9e2">Chunk</text>
    <text x="528" y="105" text-anchor="middle" font-size="12" fill="#9c9890">~200 words, page-tagged</text>
  </g>
