    <text x="326" y="315" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ece9e2">Understand it</text>
    <text x="326" y="333" text-anchor="middle" font-size="12" fill="#9c9890">rewrite follow-ups</text>
  </g>
  <g>
    <rect x="440" y="292" width="176" height="54" rx="10" fill="#1c1f24" stroke="#363b43"/>
    <text x="528" y="315" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ece9e2">Hybrid search</text>
    <text x="528" y="333" text-anchor="middle" font-size="12" fill="#9c9890">RRF fusion + MMR</text>
  </g>
